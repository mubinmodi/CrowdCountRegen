# Deploys the AWS demo after CI passes on main, behind a manual approval.
#
#   CI passes on main ─▶ plan: cdk diff (read-only role) ─▶ approval ─▶ deploy: cdk deploy
#
# AWS access is through OIDC: GitHub issues a short-lived token for each job, and AWS only
# accepts it for this repository's `aws-plan` / `production` environments (see
# infra/crowdcounting_infra/github.py). No AWS keys are stored in GitHub. The approval is
# the `production` environment's required reviewers. One-time setup is in
# docs/deployment-aws.md#continuous-deployment; until the role variables exist, every run
# skips both jobs.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK: CrowdCounting
  # The commit CI tested (workflow_run), or the branch tip (manual run).
  REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    name: Plan (cdk diff)
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' && vars.AWS_DEPLOY_ROLE_ARN != '' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: aws-plan
    permissions:
      contents: read
      id-token: write  # to request the OIDC token
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: crowdcounting-plan-${{ github.run_id }}
      - name: Diff against the deployed stack
        # --no-change-set: a template diff, which the read-only lookup role can do.
        run: |
          npx -y aws-cdk@2 diff "$STACK" --no-change-set 2>&1 | tee diff.txt
          {
            echo "### Changes to \`$STACK\` at \`${REF:0:7}\`"
            echo
            echo "Approving the **production** deployment applies these changes."
            echo
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (cdk deploy)
    needs: plan
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the job wait for a human's approval.
    environment:
      name: production
      url: ${{ steps.outputs.outputs.url }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 75  # CloudFormation waits up to 45 min for the new instance to be healthy
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: crowdcounting-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Deploy
        # A failed health check rolls the stack back by itself; the old instance keeps serving.
        run: npx -y aws-cdk@2 deploy "$STACK" --require-approval never --outputs-file outputs.json
      - name: Outputs
        id: outputs
        run: |
          url=$(jq -r --arg s "$STACK" '.[$s].Url' outputs.json)
          dashboard=$(jq -r --arg s "$STACK" '.[$s].DashboardUrl' outputs.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed \`${REF:0:7}\`"
            echo
            echo "- Demo: $url"
            echo "- Dashboard: $dashboard"
          } >> "$GITHUB_STEP_SUMMARY"
