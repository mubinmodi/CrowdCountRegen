[project]
name = "zonewatch-infra"
version = "0.1.0"
description = "AWS CDK app that deploys the Zonewatch demo to one GPU instance behind CloudFront"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aws-cdk-lib>=2.275,<3",
    "constructs>=10.8,<11",
    "cdk-nag>=3.0,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
