# Used by the alembic CLI, e.g. `uv run alembic revision --autogenerate -m "..."`.
# The app itself runs migrations on startup (app.db.init_db); the database URL comes
# from ZW_DATABASE_URL either way.
[alembic]
script_location = app/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
